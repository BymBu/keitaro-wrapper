<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Keitaro Wrapper</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f4f4f4; }
        .container { max-width: 1000px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        input, select, button { padding: 8px; margin-right: 10px; }
        .btn { cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        .btn:hover { background: #0056b3; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #a71d2a; }
    </style>
</head>
<body>
<div class="container">
    <h1>Keitaro Wrapper</h1>

    <h2>Создать кампанию</h2>
    <div class="form-group">
        <input type="text" id="campaignName" placeholder="Название (test_фамилия_...)" required>
        <input type="text" id="campaignGeo" placeholder="Гео (RU)" required>
        <input type="number" id="campaignOfferId" placeholder="Offer ID" required>
        <button class="btn" onclick="createCampaign()">Создать</button>
    </div>
    <div id="createStatus"></div>

    <h2>Кампании</h2>
    <table id="campaignsTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Гео</th>
                <th>Offer ID</th>
                <th>Keitaro ID</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <h2>Офферы кампании <span id="currentCampaignName"></span></h2>
    <div id="offersSection" style="display: none;">
        <div class="form-group">
            <input type="number" id="newOfferId" placeholder="Offer ID">
            <button class="btn" onclick="addOffer()">Добавить оффер</button>
        </div>
        <ul id="offersList"></ul>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
